<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
__LAYOUT_CSS__
</style>
<style>
/* ===== 主题：__THEME_NAME__ ===== */
__THEME_CSS__
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
/* 由 Python 注入的配置 */
const CFG = __CFG_JSON__;

const PAGE_H = 1656;

function textOf(el) { return el.textContent.trim(); }

function outerH(el) {
  return el.offsetHeight + parseFloat(getComputedStyle(el).marginBottom || 0);
}

/* 排版参数（CSS 变量）注入到每个 .page */
function applyParams(el) {
  if (!CFG.params) return;
  for (const [k, v] of Object.entries(CFG.params)) {
    if (v !== null && v !== undefined && v !== "") el.style.setProperty(k, v);
  }
}

function waitImages(root) {
  const imgs = [...root.querySelectorAll("img")];
  return Promise.all(imgs.map(img => img.complete ? 1 :
    new Promise(res => { img.onload = img.onerror = () => res(1); })));
}

/* 封面页 */
function buildCover() {
  const page = document.createElement("div");
  page.className = "page cover";
  applyParams(page);
  const pad = document.createElement("div");
  pad.className = "pad";
  const title = document.createElement("div");
  title.className = "cover-title";
  title.textContent = CFG.title;
  pad.appendChild(title);
  const bar = document.createElement("div");
  bar.className = "cover-bar";
  pad.appendChild(bar);
  const meta = [];
  if (CFG.author) meta.push(CFG.author);
  if (CFG.date) meta.push(CFG.date);
  if (meta.length) {
    const m = document.createElement("div");
    m.className = "cover-meta";
    m.textContent = meta.join("  ·  ");
    pad.appendChild(m);
  }
  page.appendChild(pad);
  return page;
}

/* 正文页（pageno 形如 2 / 5；cover 不占页码） */
function buildPage(children, idx, total, isLong) {
  const page = document.createElement("div");
  page.className = isLong ? "page long" : "page";
  applyParams(page);
  const pad = document.createElement("div");
  pad.className = "pad";
  children.forEach(c => pad.appendChild(c));
  page.appendChild(pad);
  if (CFG.mode === "cards") {
    const no = document.createElement("div");
    no.className = "pageno";
    no.textContent = (idx + 1) + " / " + total;
    page.appendChild(no);
  }
  return page;
}

async function main() {
  const stage = document.getElementById("stage");

  /* raw 模式：直接展示注入的 stageHtml（工作台导出用），不分页 */
  if (CFG.mode === "raw") {
    stage.innerHTML = CFG.stageHtml;
    await waitImages(stage);
    await document.fonts.ready;
    document.title = "ready";
    return;
  }

  /* 量尺：一个离屏的 .page > .pad，主题样式因此与真实页面同源 */
  const measure = document.createElement("div");
  measure.id = "measure";
  measure.className = "page";
  applyParams(measure);
  const mpad = document.createElement("div");
  mpad.className = "pad";
  mpad.innerHTML = CFG.contentHtml;
  measure.appendChild(mpad);
  document.body.appendChild(measure);
  await waitImages(measure);
  await document.fonts.ready;

  /* 每页可用内容高 = 页高 - 上下边距（读注入变量在量尺上的计算值） */
  const mcs = getComputedStyle(measure);
  const availH = PAGE_H
    - parseFloat(mcs.getPropertyValue("--pad-top"))
    - parseFloat(mcs.getPropertyValue("--pad-bottom"));

  /* 封面：取正文第一个 h1 的标题，h1 本身不进入正文流。
     仅卡片模式需要；长图模式保留 h1 作为长图大标题。 */
  if (CFG.cover && CFG.mode === "cards") {
    const first = mpad.children[0];
    if (first && /^H1$/.test(first.tagName)) {
      CFG.title = textOf(first) || CFG.title;
      first.remove();
    }
  }

  const kids = [...mpad.children];
  /* groups: [{els, h}]，h = 组内内容总高（含尾元素 margin-bottom，测量值） */
  const groups = [];

  if (CFG.mode === "long") {
    groups.push({ els: kids, h: 0 });
  } else {
    /* 贪心填充分页：块级元素逐个放入当前页，超出则另起一页。 */
    let cur = { els: [], h: 0 }, startY = 0;
    for (const el of kids) {
      const h = outerH(el);
      if (cur.els.length && el.offsetTop + h - startY > availH) {
        groups.push(cur);
        cur = { els: [], h: 0 };
        startY = el.offsetTop;
      }
      cur.els.push(el);
      cur.h = el.offsetTop + h - startY;
    }
    if (cur.els.length) groups.push(cur);

    /* 标题不孤行：页尾若以 h1-h3 结尾，移到下一页开头；
       但接收页必须装得下，否则宁可保留孤行也不能溢出。 */
    for (let i = 0; i < groups.length - 1; i++) {
      const g = groups[i];
      while (g.els.length > 1 && /^H[1-3]$/.test(g.els[g.els.length - 1].tagName)) {
        const head = g.els[g.els.length - 1];
        const headH = outerH(head);
        if (groups[i + 1].h + headH > availH) break;
        g.els.pop();
        g.h -= headH;
        groups[i + 1].els.unshift(head);
        groups[i + 1].h += headH;
      }
    }
  }

  const total = groups.length;
  /* 调试钩子：记录算法看到的分组与测量值，供诊断脚本读取 */
  window.__diag = groups.map(g => g.els.map(el => ({
    tag: el.tagName,
    top: el.offsetTop,
    h: outerH(el),
  })));
  const isLong = CFG.mode === "long";
  groups.forEach((g, i) => stage.appendChild(buildPage(g.els, i, total, isLong)));

  if (CFG.cover && CFG.mode === "cards") stage.insertBefore(buildCover(), stage.firstChild);

  measure.remove();
  document.title = "ready"; /* 给 Playwright 的完成信号 */
}

main();
</script>
</body>
</html>
