[project]
name = "md2xhs"
version = "0.0.1"
description = "Markdown → 小红书图文卡片 / 长图"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py[linkify]>=3.0",
    "playwright>=1.49",
]

[project.scripts]
md2xhs = "md2xhs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["md2xhs"]
